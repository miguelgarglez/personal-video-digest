name: CLI quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            name: Apple Silicon
          - os: ubuntu-24.04
            arch: x86_64
            name: Linux x64
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Assert supported architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Type-check
        run: bun run typecheck
      - name: Verify package contents
        run: bun run verify:package
      - name: Smoke-test packed CLI
        run: bun run smoke:package
